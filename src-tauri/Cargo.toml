[package]
name = "gh-presentation"
version = "0.1.0"
description = "PowerCore GitHub Presentation Optimizer"
authors = ["PowerCore"]
edition = "2021"

[lib]
name = "gh_presentation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
